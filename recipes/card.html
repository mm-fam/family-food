<!doctype html>
<html><head><meta charset="utf-8"><title>Recipe card</title>
<style>
  /* One-page "directional" recipe card (Nov 7): what we're making, the must-haves with a swap for each,
     a few big moves, the one thing that matters, how you know it's done, Plan B. */
  @page { size: Letter; margin: 0; }
  :root { --ink: #1f2a24; --soft: #5b6a62; --line: #d9e2dc; --acc: #2E6B4E; --acc-soft: #E2F0E8; --warm: #B45309; --warm-soft: #FEF3C7; --fs: 12.4pt; }
  .k-breakfast { --acc: #B45309; --acc-soft: #FEF3E2; --warm: #9D174D; --warm-soft: #FCE7F1; }
  .k-lunch { --acc: #1D4E89; --acc-soft: #E3EDF8; }
  .k-snack { --acc: #9D174D; --acc-soft: #FCE7F1; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: Inter, 'Noto Color Emoji', sans-serif; color: var(--ink); font-size: var(--fs); line-height: 1.35; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .emoji { font-family: 'Noto Color Emoji'; }
  .page { width: 8.5in; height: 11in; padding: 0.45in 0.55in 0.4in; display: flex; flex-direction: column; gap: 0.14in; overflow: hidden; }
  .hd { display: flex; gap: 0.2in; align-items: center; border-bottom: 3px solid var(--acc); padding-bottom: 0.14in; }
  .badge { flex: none; width: 1in; height: 1in; border-radius: 50%; background: var(--acc-soft); display: flex; align-items: center; justify-content: center; font-size: 42pt; font-family: 'Noto Color Emoji'; }
  .hd-main { flex: 1; min-width: 0; }
  .kicker { font-size: 8pt; letter-spacing: .14em; text-transform: uppercase; color: var(--acc); font-weight: 700; }
  h1 { font-family: Lora, Georgia, serif; font-size: 27pt; margin: 1px 0 4px; line-height: 1.05; }
  .what { margin: 0; font-size: 1.02em; color: var(--soft); }
  .meta { flex: none; display: flex; flex-direction: column; gap: 6px; }
  .pill { border: 1.5px solid var(--line); border-radius: 10px; padding: 4px 12px; text-align: center; }
  .pill b { display: block; font-size: 14pt; }
  .pill span { font-size: 7pt; letter-spacing: .1em; text-transform: uppercase; color: var(--soft); }
  .early { background: var(--warm-soft); border-radius: 10px; padding: 7px 12px; font-size: .95em; margin: 0; }
  .early b { color: var(--warm); }
  h2 { font-family: Lora, Georgia, serif; color: var(--acc); font-size: 1.2em; margin: 0 0 6px; }
  .must { background: var(--acc-soft); border-radius: 14px; padding: 0.14in 0.18in; }
  .must .lead { margin: 0 0 8px; font-size: .82em; color: var(--soft); }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 6px 4px; border-top: 1px dotted #a9bcb0; vertical-align: top; }
  tr:first-child td { border-top: 0; }
  td.box { width: 22px; }
  .box i { display: inline-block; width: 13px; height: 13px; border: 1.6px solid var(--acc); border-radius: 3px; transform: translateY(2px); }
  td.name { font-weight: 700; width: 46%; }
  td.out { color: var(--soft); font-size: .9em; }
  td.out b { color: var(--warm); font-weight: 700; }
  .extras { font-size: .92em; margin: 0; }
  .extras b { color: var(--acc); }
  ol { list-style: none; margin: 0; padding: 0; counter-reset: s; }
  ol li { counter-increment: s; display: grid; grid-template-columns: .38in 1fr; gap: 8px; padding: 0 0 9px; }
  ol li::before { content: counter(s); width: .32in; height: .32in; border-radius: 50%; background: var(--acc); color: #fff; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .t { font-size: .72em; font-weight: 700; background: #eef1ef; color: var(--soft); border-radius: 99px; padding: 1px 7px; margin-left: 4px; white-space: nowrap; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: .16in; }
  .tip { border: 2px dashed var(--acc); border-radius: 12px; padding: 8px 12px; font-size: .92em; }
  .tip b { display: block; font-size: 7.5pt; letter-spacing: .12em; text-transform: uppercase; color: var(--acc); margin-bottom: 2px; }
  .planb { background: var(--warm-soft); border-radius: 12px; padding: 10px 14px; font-size: .95em; }
  .planb b { color: var(--warm); }
  .ft { margin-top: auto; display: flex; align-items: center; gap: .16in; border-top: 1px solid var(--line); padding-top: 8px; font-size: 8pt; color: var(--soft); }
  .ft .qr { flex: none; width: .6in; height: .6in; }
  .ft .qr svg { width: 100%; height: 100%; display: block; }
  .ft img { height: 18px; border-radius: 4px; vertical-align: middle; margin-right: 5px; }
  .ft .grow { flex: 1; }
</style></head>
<body>__BODY__</body></html>
